# 3xCodz Management System - Nginx site configuration
# Place at /etc/nginx/sites-available/3xcode and symlink into sites-enabled.
# Replace every occurrence of yourdomain.com before issuing certificates.

upstream 3xcode_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# Per-IP rate limiting (limit_req_zone must live in the http context, which
# this file is included from). Express applies its own counters on top.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot webroot for HTTP-01 renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (only enable once HTTPS is confirmed working for the domain).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads are capped at MAX_FILE_SIZE_MB (default 15MB) - leave headroom.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --------------------------------------------------------------- API ----
    # Authentication endpoints: tight per-IP budget (5/min, burst 20) to slow
    # credential stuffing and password-reset abuse.
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://3xcode_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api {
        limit_req zone=api_limit burst=120 nodelay;
        proxy_pass http://3xcode_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # PDF/CSV exports may take a moment on large datasets.
        proxy_buffering off;
    }

    # Authenticated file downloads (never served from a static root).
    location /api/attachments {
        proxy_pass http://3xcode_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_max_temp_file_size 0;
        proxy_buffering off;
    }

    # ------------------------------------------------------- Static assets ---
    root /var/www/3xcode-management/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ----------------------------------------------------------- SPA shell ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
